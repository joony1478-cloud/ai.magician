<!doctype html><html><head><meta charset="utf-8"><style>
.k-badge{left:70px;top:36px}
.k-win{left:150px;top:90px;width:780px;height:500px}
.k-me,.k-ai{font-size:28px}
.k-chat{padding-bottom:120px}
</style></head><body>
<div class="k-badge">1</div>
<div class="k-win"><div class="k-bar"><i></i><i></i><i></i><b>AI 채팅</b></div>
  <div class="k-chat">
    <div class="k-me" id="me">이 글 다시 써줘. '결론적으로', '다양한', '~할 수 있습니다' 쓰지 마.</div>
    <div class="k-ai" id="ai"><span>이 제품 쓰고 <span class="k-hl" id="h">보고서 쓰는 시간이 절반</span>으로 줄었어요.</span></div>
  </div>
  <div class="k-input" id="in"></div>
</div>
<script>
K.dur(6);
const end = K.type("#in","이 글 다시 써줘. '결론적으로', '다양한', '~할 수 있습니다' 쓰지 마.",0.4,18,{placeholder:"메시지를 입력하세요"});
K.cursor([[0,700,640],[end-0.4,880,540],[end+0.6,880,540],[6,860,600]],[end+0.1]);
K.at(t=>{document.getElementById("in").style.visibility = t>end+0.2?"hidden":"visible"});
K.show("#me",end+0.25,"up",.35);
K.show("#ai",end+0.9,"up",.4);
K.sweep("#h",end+1.6,.5);
</script></body></html>
