<!doctype html><html><head><meta charset="utf-8"><style>
body.dark{background:#0b0b0b}
.glow{position:absolute;left:90px;top:200px;width:900px;height:170px;border-radius:40px;box-shadow:0 0 90px rgba(242,225,91,.28)}
.box{position:absolute;left:80px;top:200px;width:920px;min-height:170px;border:4px solid #f2e15b;border-radius:34px;background:#141414;padding:34px 150px 34px 44px;font-weight:700;font-size:54px;line-height:1.3;color:#fff;letter-spacing:-.04em}
.send{position:absolute;left:880px;top:243px;width:84px;height:84px;border-radius:22px;background:#f2e15b;color:#111;display:grid;place-items:center;font-weight:900;font-size:46px}
.lb{position:absolute;left:84px;top:140px;font-weight:800;font-size:28px;color:#f2e15b;letter-spacing:.04em}
.tips{position:absolute;left:80px;top:430px;display:grid;gap:20px}
.tip{display:flex;align-items:center;gap:22px;padding:18px 34px 18px 20px;background:#fff;color:#111;border-radius:999px;font-weight:800;font-size:40px;width:max-content;letter-spacing:-.03em}
.tip i{font-style:normal;width:58px;height:58px;border-radius:50%;background:#111;color:#f2e15b;display:grid;place-items:center;font-weight:900;font-size:32px}
.k-ph{color:#666}
</style></head><body class="dark">
<div class="lb" id="lb">AI술사의 주문</div>
<div class="glow" id="g"></div>
<div class="box" id="in"></div>
<div class="send" id="s">↑</div>
<div class="tips">
  <div class="tip t1"><i>1</i>금지어 주기</div>
  <div class="tip t2"><i>2</i>내 글 보여주기</div>
  <div class="tip t3"><i>3</i>독자 한 명 정하기</div>
</div>
<script>
K.dur(6);
K.show("#lb",0.1,"fade",.3);
const end=K.type("#in","이 글, AI 티 안 나게 고쳐줘",0.4,9,{placeholder:"무엇이든 물어보세요"});
K.cursor([[0,700,560],[end-0.3,925,290],[end+0.4,925,290],[6,940,330]],[end+0.05]);
K.at(t=>{document.getElementById("s").style.transform=`scale(${t>end+0.05&&t<end+0.2?0.88:1})`;
  const p=Math.max(0,Math.min(1,(t-end)/.5)); document.getElementById("g").style.opacity=0.3+0.7*Math.sin(p*Math.PI);});
K.show(".t1",end+0.5,"left",.35); K.show(".t2",end+0.8,"left",.35); K.show(".t3",end+1.1,"left",.35);
</script></body></html>
