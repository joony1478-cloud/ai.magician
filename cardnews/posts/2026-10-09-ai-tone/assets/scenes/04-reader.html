<!doctype html><html><head><meta charset="utf-8"><style>
.k-badge{left:70px;top:36px}
.k-input{position:absolute;left:150px;right:150px;top:56px;bottom:auto}
.k-card{width:370px;top:190px;height:300px;font-size:27px}
.before{left:150px;color:#777}
.after{left:560px;border-color:#111;box-shadow:8px 8px 0 #f2e15b}
.k-card h4{color:#999}.after h4{color:#111}
.arrow{position:absolute;left:520px;top:315px;font-weight:900;font-size:40px}
</style></head><body>
<div class="k-badge">3</div>
<div class="k-input" id="in"></div>
<div class="k-card before" id="b"><h4>BEFORE</h4>본 서비스는 다양한 기능을 통해 업무 효율성을 극대화할 수 있습니다.</div>
<div class="arrow" id="ar">→</div>
<div class="k-card after" id="a"><h4>AFTER</h4><span id="at"></span></div>
<script>
K.dur(6.5);
K.show("#b",0.2,"up",.4);
const end = K.type("#in","30대 직장인 친구한테 카톡하듯이 다시 써줘",0.6,16,{placeholder:"메시지를 입력하세요"});
K.show("#ar",end+0.3,"left",.3);
K.show("#a",end+0.45,"right",.4);
K.type("#at","야 이거 써봐. 보고서 쓰는 시간 진짜 반으로 줄었어 ㅋㅋ 버튼 하나면 끝.",end+0.8,20);
</script></body></html>
