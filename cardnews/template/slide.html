<!doctype html>
<!--
  AI술사 카드뉴스 슬라이드 템플릿 (1080x1350, 인스타 4:5)
  레퍼런스 구조: [검정 상단띠: 시리즈명 + 큰 제목] [가로 꽉 찬 GIF 띠] [검정 하단띠: 설명 2~3줄]
  render.mjs 가 window.__SLIDE__ 에 데이터를 넣고 이 페이지를 찍는다.
  #media 박스는 "구멍"으로 남겨두고(투명), GIF/영상은 ffmpeg 가 그 자리 밑에 깐다.
  인스타가 페이지 번호(1/5)와 하단 아이콘을 덮어 그리므로 우상단·최하단 110px 에는 중요한 내용을 두지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Brand;font-weight:900;src:url(../fonts/Paperlogy-9Black.woff2) format("woff2"),url(../fonts/Pretendard-Black.woff2) format("woff2")}
@font-face{font-family:Brand;font-weight:800;src:url(../fonts/Paperlogy-8ExtraBold.woff2) format("woff2"),url(../fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Brand;font-weight:700;src:url(../fonts/Paperlogy-6SemiBold.woff2) format("woff2"),url(../fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Brand;font-weight:500;src:url(../fonts/Paperlogy-4Regular.woff2) format("woff2"),url(../fonts/Pretendard-Medium.woff2) format("woff2")}
:root{
  --ink:#0b0b0b; --paper:#fafaf8; --text:#f4f4f1; --sub:#a9a9a4; --line:#2a2a2a;
  --accent:#f2e15b; --accent-ink:#141414;
  --pad:96px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:transparent;overflow:hidden}
body{font-family:Brand,"Apple SD Gothic Neo",sans-serif;color:var(--text);word-break:keep-all;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}

#paper{position:absolute;inset:0;background:var(--ink)}
#media{position:absolute}
.content{position:absolute;inset:0}

/* 인라인 강조: <b> 굵게, <mark> 반전 박스(레퍼런스의 흰 박스 → 브랜드 노랑) */
b{font-weight:800;color:#fff}
mark{background:var(--accent);color:var(--accent-ink);padding:0 .14em;margin:0 .04em;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.w{background:#fff;color:var(--ink)}

.series{position:absolute;left:0;right:0;top:46px;text-align:center;font-weight:500;font-size:30px;color:#d8d8d4;letter-spacing:-.03em}

/* ---------- body (기본: 검정 / 흰 GIF 띠 / 검정) ---------- */
.body #media{left:0;top:280px;width:1080px;height:660px}
.body h2{position:absolute;left:60px;right:60px;top:118px;height:130px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:900;font-size:84px;line-height:1.08;letter-spacing:-.055em;color:#fff}
.body h2.long{font-size:66px}
.body .lines{position:absolute;left:var(--pad);right:var(--pad);top:1000px;display:grid;gap:30px;font-weight:500;font-size:40px;line-height:1.38;color:#ececea}

/* body theme:light (전부 흰 배경 + 테두리 박스 설명) */
.light #paper{background:var(--paper)}
.light .series{color:#6b6b66}
.light h2{color:var(--ink)}
.light .lines{left:64px;right:64px;top:986px;padding:38px 40px;background:#fff;border:2.5px solid var(--ink);box-shadow:10px 10px 0 rgba(0,0,0,.12);color:#222;font-size:38px;gap:26px}
.light b{color:var(--ink)}
.light mark.w{background:var(--ink);color:#fff}

/* ---------- cover (GIF 전체 배경) ---------- */
.cover #media{left:0;top:0;width:1080px;height:1350px}
.cover .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 48%,rgba(0,0,0,.78) 74%,rgba(0,0,0,.92))}
.cover.noshade .shade{display:none}
.cover .series{text-shadow:0 2px 10px rgba(0,0,0,.7);color:#eee}
.cover .txt{position:absolute;left:64px;right:48px;bottom:150px}
.cover .chip{display:inline-block;background:#fff;color:var(--ink);font-weight:900;font-size:50px;letter-spacing:-.02em;padding:8px 30px 6px;border-radius:999px;margin-bottom:26px}
.cover .chip.y{background:var(--accent)}
.cover h1{font-weight:900;font-size:110px;line-height:1.06;letter-spacing:-.065em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.cover h1 mark{background:none;color:var(--accent);padding:0;margin:0;font-weight:900}
.cover .chip.o{background:none;color:#fff;border:3px solid #fff;font-weight:700;font-size:40px;padding:6px 30px 4px;margin-bottom:30px}

/* cover + "coverStyle":"news" — 일러스트 뉴스형 (전체 일러스트 → 하단 검정 페이드 → 외곽선 칩 + 흰 제목 2줄) */
.cover.news .shade{background:linear-gradient(rgba(0,0,0,0) 46%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.94) 76%,#000)}
.cover.news .txt{bottom:140px}
.cover.news h1{font-weight:800;font-size:90px;line-height:1.24;letter-spacing:-.045em;text-shadow:none}

/* ---------- cta ---------- */
.cta h2{position:absolute;left:60px;right:60px;top:150px;text-align:center;font-weight:900;font-size:80px;line-height:1.14;letter-spacing:-.055em;color:#fff}
.cta h2 mark{background:none;color:var(--accent);padding:0;margin:0;font-weight:900}
.cta .rows{position:absolute;left:var(--pad);right:var(--pad);top:470px;display:grid;gap:26px}
.cta .row{display:flex;align-items:center;gap:28px;padding:34px 36px;border:2px solid var(--line);border-radius:22px;font-weight:700;font-size:40px;line-height:1.3}
.cta .row .n{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:34px}
.cta .row.key{border-color:var(--accent)}
.cta .row.key .n{background:var(--accent)}
.cta .row small{display:block;font-weight:500;font-size:30px;color:var(--sub);margin-top:6px}
.cta .sign{position:absolute;left:0;right:0;top:1090px;text-align:center;font-weight:800;font-size:34px;color:var(--sub)}
.cta .sign b{color:var(--accent)}
</style>
</head>
<body>
<div id="paper"></div>
<div id="media"></div>
<div class="content" id="root"></div>
<script>
const D = window.__SLIDE__ || {slide:{type:"body",title:"1. 미리보기",body:"첫 줄은 <b>굵게</b>\n둘째 줄은 <mark>강조</mark>"},index:1,total:5,series:"오늘 바로 써먹는 AI, AI술사",handle:"ai.magician",brand:"AI술사"};
const s = D.slide;
// 허용 태그(mark, mark.w, b, br)만 살리고 나머지는 이스케이프
const rich = t => String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))
  .replace(/&lt;(\/?)(mark|b)( class=&quot;(w)&quot;)?&gt;/g,(m,sl,tag,_,cls)=>`<${sl}${tag}${cls?` class="${cls}"`:''}>`)
  .replace(/&lt;br\s*\/?&gt;|\n/g,"<br>");
const lines = t => String(t||"").split("\n").filter(Boolean).map(l=>`<p>${rich(l)}</p>`).join("");
const hasMedia = !!s.media;
// textless: GIF 안에 제목까지 다 그려져 있는 표지 (템플릿은 시리즈명도 안 얹음)
document.body.className = s.type + (s.theme === "light" ? " light" : "") + (s.shade === false ? " noshade" : "") + (s.coverStyle ? " " + s.coverStyle : "");
const series = s.series === false ? "" : `<div class="series">${rich(s.series || D.series)}</div>`;

let html = "";
if (s.type === "cover") {
  html = s.textless ? "" : `<div class="shade"></div>${series}
  <div class="txt">${s.chip?`<span class="chip${s.chipStyle==="accent"?" y":s.chipStyle==="outline"?" o":""}">${rich(s.chip)}</span>`:""}<h1>${rich(s.title)}</h1></div>`;
} else if (s.type === "body") {
  const plain = String(s.title||"").replace(/<[^>]+>/g,"");
  html = `${series}<h2 class="${plain.length>12?"long":""}">${rich(s.title)}</h2><div class="lines">${lines(s.body)}</div>`;
} else if (s.type === "cta") {
  const kw = s.keyword || "주문서";
  html = `<h2>${rich(s.title || "나중에 또 찾지 말고\n<mark>저장</mark>해두세요")}</h2>
  <div class="rows">
    <div class="row key"><span class="n">1</span><div>댓글에 <mark>${rich(kw)}</mark> 남기기<small>${rich(s.dm || "자료 링크를 DM으로 보내드려요")}</small></div></div>
    <div class="row"><span class="n">2</span><div>저장해두고 필요할 때 꺼내 쓰기</div></div>
    <div class="row"><span class="n">3</span><div>@${rich(D.handle)} 팔로우<small>${rich(s.follow || "매일 바로 써먹는 AI 꿀팁")}</small></div></div>
  </div>
  <div class="sign">${rich(s.series || D.series).replace(rich(D.brand),`<b>${rich(D.brand)}</b>`)}</div>`;
}
document.getElementById("root").innerHTML = html;

// #media 자리에 구멍 뚫기 + 렌더러에게 좌표 알려주기
const m = document.getElementById("media");
if (hasMedia && s.type !== "cta") {
  const r = m.getBoundingClientRect();
  const {x,y,width:w,height:h} = r;
  const path = `M0 0H1080V1350H0Z M${x} ${y}H${x+w}V${y+h}H${x}Z`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><path fill-rule="evenodd" d="${path}"/></svg>`;
  const p = document.getElementById("paper");
  p.style.webkitMaskImage = p.style.maskImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
  window.__MEDIA_BOX__ = {x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
} else {
  m.remove();
  window.__MEDIA_BOX__ = null;
}
window.__READY__ = document.fonts.ready.then(()=>true);
</script>
</body>
</html>
