=====================================================================

   create table leads (
     id bigint generated always as identity primary key,
     name text not null,

     email text not null unique,
     marketing_consent boolean default false,
     source text,
     created_at timestamptz default now()

   alter table leads enable row level security;
   grant insert on table leads to anon;
   create policy "anon can insert" on leads for insert to anon with check (true);
   -- 조회 정책은 만들지 않음 → 리드 목록(이름/전화/이메일)은 나만 대시보드 Table Editor에서 확인/CSV 다운로드

:root{
  --bg:#1f1f1f; --bg2:#272727; --bg3:#303030; --line:#3d3d3d; --grid:rgba(255,255,255,.045);

/* 휴대폰 화면은 같은 색도 더 밝고 회색빛으로 보여서, 모바일에서만 한 단계 더 짙게 */
@media (max-width:859px){
  :root{--bg:#121212; --bg2:#1a1a1a; --bg3:#232323; --line:#333; --grid:rgba(255,255,255,.04)}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:Paperlogy,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;color:var(--text);background:var(--bg);
  min-height:100vh;min-height:100dvh;line-height:1.6;overflow-x:hidden;word-break:keep-all;caret-color:var(--stamp)}
::selection{background:var(--stamp);color:var(--stamp-ink)}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
button{font-family:inherit;color:inherit}
a{color:inherit}
.ph-bold{font-size:1.15em;line-height:1;vertical-align:-.15em}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:stretch;height:60px;border-bottom:1px solid var(--line)}
.bar .mark{width:60px;flex:none;display:grid;place-items:center;border-right:1px solid var(--line);font-weight:800;font-size:22px;color:var(--stamp)}
.bar .fill{flex:1;border-bottom:6px solid #e9e8e3;margin-bottom:-1px}
.bar a{display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14px;font-weight:600;color:var(--sub);text-decoration:none;border-left:1px solid var(--line)}
.bar a:hover{color:var(--text)}

/* ---------- hero ---------- */
.hero{position:relative;padding:44px 20px 40px;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.hero-in{max-width:1120px;margin:0 auto;display:grid;gap:32px}
.hero h1{font-weight:800;font-size:clamp(68px,19vw,168px);line-height:.98;letter-spacing:-.045em}
.meta{display:grid;gap:26px;max-width:460px}
.meta dt{font-weight:800;font-size:clamp(19px,4.8vw,22px);letter-spacing:-.01em}
.meta dd{margin-top:6px;font-size:clamp(17px,4.4vw,19px);color:var(--sub);line-height:1.6}

/* postage stamp: 프로필 사진이 들어가는 노란 우표 */
.stamp-wrap{position:absolute;top:22px;right:18px;transform:rotate(7deg);filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.stamp{width:104px;height:122px;padding:7px;background:var(--stamp);
  -webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle,#0000 3.1px,#000 3.6px) 0 0/11px 11px round;
          mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle,#0000 3.1px,#000 3.6px) 0 0/11px 11px round}
.stamp-in{height:100%;border:1.5px solid var(--stamp-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--stamp-ink);overflow:hidden}
.stamp-in .face{width:58px;height:58px;display:grid;place-items:center;font-weight:800;font-size:36px;line-height:1}
.stamp-in .face img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);display:block}
.stamp-in b{font-weight:800;font-size:14px;letter-spacing:-.02em}

/* ---------- gate ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px calc(56px + env(safe-area-inset-bottom))}
.gate{display:flex;align-items:center;gap:14px;margin:28px 0 36px;padding:16px 16px 16px 18px;border:1px solid var(--line);background:var(--bg2)}
.gate .ic{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);font-size:20px;color:var(--sub);transition:color .4s,border-color .4s,background-color .4s}
.gate .tx{flex:1;min-width:0}
.gate .tx b{display:block;font-weight:800;font-size:16px;line-height:1.4}
.gate .tx span{display:block;margin-top:2px;font-size:14px;color:var(--sub)}
.gate.is-open .ic{color:var(--stamp-ink);background:var(--stamp);border-color:var(--stamp)}
.gate.is-open .btn{display:none}
.btn{appearance:none;border:0;cursor:pointer;flex:none;font-weight:800;font-size:15px;min-height:48px;padding:0 20px;color:var(--stamp-ink);background:var(--stamp);
  transition:background-color .2s,transform .15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--stamp2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:progress}

/* ---------- files ---------- */
.files-h{font-weight:800;font-size:24px;letter-spacing:-.02em;margin-bottom:14px}
.files-wrap{position:relative}
.files{list-style:none;display:grid;gap:12px}
.clip{position:absolute;top:-50px;right:100px;width:30px;height:76px;transform:rotate(9deg);z-index:2;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.file{position:relative;display:grid;gap:10px;padding:22px 20px 20px;border:1px solid var(--line);background:var(--bg2);text-decoration:none;overflow:hidden;
  transition:background-color .2s,border-color .2s,transform .15s var(--ease)}
.file:hover{background:var(--bg3);border-color:#555}
.file:active{transform:translateY(1px)}
.file .ttl{font-weight:800;font-size:clamp(20px,5.4vw,26px);line-height:1.32;letter-spacing:-.025em;padding-right:76px;text-wrap:balance}
.file .ttl .ph-bold{font-size:.8em;margin-left:4px;color:var(--stamp);opacity:0;transition:opacity .3s}
.file .desc{font-size:15px;color:var(--sub);line-height:1.55;padding-right:20px}
.file .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:13px;font-weight:600;line-height:1;padding:7px 9px;border:1px solid var(--line);color:var(--sub)}
.tag.easy{border-color:var(--stamp);color:var(--stamp)}
/* 잠김 표시 → 열리면 '개봉' 고무도장이 찍힘 */
.file .seal{position:absolute;top:20px;right:18px;display:grid;place-items:center;width:62px;height:62px;border:1.5px dashed var(--dim);border-radius:50%;
  font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.02em;transition:opacity .2s}
.file .inked{position:absolute;top:18px;right:12px;display:grid;place-items:center;width:70px;height:70px;border:3px solid var(--stamp);border-radius:50%;
  color:var(--stamp);font-weight:800;font-size:17px;letter-spacing:.04em;transform:rotate(-12deg) scale(1.7);opacity:0;pointer-events:none}
.file .inked::before{content:"";position:absolute;inset:4px;border:1px solid var(--stamp);border-radius:50%}
.file.is-open .seal{opacity:0}
.file.is-open .inked{opacity:1;transform:rotate(-12deg) scale(1);transition:transform .26s cubic-bezier(.7,0,.84,0),opacity .1s}
.file.is-open .ttl .ph-bold{opacity:1}

.insta{display:flex;align-items:center;gap:10px;min-height:52px;margin-top:28px;padding:0 18px;border:1px solid var(--line);font-size:15px;font-weight:600;text-decoration:none;color:var(--sub)}
.insta b{color:var(--text);font-weight:800}
.insta:hover{background:var(--bg2)}
footer{margin-top:20px;font-size:13px;color:var(--sub)}
footer button{background:none;border:0;color:var(--sub);text-decoration:underline;text-underline-offset:3px;font-size:inherit;cursor:pointer;min-height:44px;padding:0 4px}

@media (min-width:860px){
  .hero{padding:72px 40px 64px}
  .hero-in{grid-template-columns:1.25fr 1fr;align-items:center}
  .meta{padding-top:12px}
  .stamp-wrap{top:40px;right:48px}
  .wrap{padding:0 40px 80px}
}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,10,10,.8)}
.overlay.on{display:flex}
.sheet{position:relative;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));animation:up .38s var(--ease)}
.sheet:focus{outline:none}
@keyframes up{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
.sheet-top{position:sticky;top:-12px;z-index:2;display:flex;justify-content:flex-end;margin:-12px -20px 4px;padding:8px 10px 0;background:inherit}
.close{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:20px}
.close:hover{background:var(--bg3)}
.sheet h2{font-weight:800;font-size:24px;line-height:1.35;letter-spacing:-.025em;margin-bottom:8px;text-wrap:balance}
.sheet .desc{color:var(--sub);font-size:15px;margin-bottom:18px}
.field+.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin-bottom:6px}
input[type=email],input[type=text],input[type=tel]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);
  min-height:52px;padding:0 14px;outline:none;border-radius:0;transition:border-color .2s}
input:is([type=email],[type=text],[type=tel]):focus{border-color:var(--stamp)}
input[aria-invalid=true]{border-color:#e07a6f}
input::placeholder{color:#8a8984}
.hint{margin-top:8px;font-size:14px}
.hint button{background:none;border:0;color:var(--stamp);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;min-height:32px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--sub);margin-top:14px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--stamp);width:18px;height:18px;flex:none}
.chk .link{background:none;border:0;color:var(--stamp);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit;padding:0 2px}
.err{color:#f0958c;font-size:14px;margin-top:12px;min-height:21px}
.submit-bar{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom));margin:6px -20px calc(-28px - env(safe-area-inset-bottom));
  padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.submit-bar .btn{width:100%;min-height:52px;font-size:16px}
.terms{list-style:none;font-size:15px;color:var(--sub);line-height:1.7}
.terms li{padding:10px 0;border-bottom:1px solid var(--line)}
.terms li b{display:block;color:var(--text);font-weight:600;font-size:13px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

/* 개봉 연출: 서류마다 '개봉' 도장이 차례로 찍힘 */
function stampAll(after){
  const files = [...document.querySelectorAll(".file")];
  const step = reduceMotion() ? 0 : 140;
  renderGate();
  if(navigator.vibrate && !reduceMotion()) try{ navigator.vibrate(15); }catch(e){}
  files.forEach((f,i)=>setTimeout(()=>{
    f.classList.add("is-open");
    f.querySelector(".sr").textContent = "열림";
  }, step*(i+1)));
  setTimeout(()=>after && after(), reduceMotion() ? 0 : step*files.length + 520);
}

/* ================= 시트(다이얼로그) 스택 + 뒤로가기 ================= */
const stack = [];   // [{ov, opener}]
const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),[tabindex]:not([tabindex="-1"])';

function showOv(id){
  const ov = $(id);
  if(stack.some(s=>s.ov===ov)) return;
  stack.push({ov, opener: document.activeElement});
  ov.classList.add("on");
  document.body.style.overflow = "hidden";
  history.pushState({sheet:stack.length}, "");
  const sheet = ov.querySelector(".sheet");
  sheet.scrollTop = 0;
  sheet.focus({preventScroll:true});
}
function hideTop(){
  const top = stack.pop(); if(!top) return;
  top.ov.classList.remove("on");
  if(!stack.length) document.body.style.overflow = "";
  if(top.opener && document.contains(top.opener)) top.opener.focus({preventScroll:true});
}
function requestClose(){ if(stack.length) history.back(); }
window.addEventListener("popstate", ()=>hideTop());

document.addEventListener("keydown", e=>{
  if(!stack.length) return;
  if(e.key==="Escape"){ e.preventDefault(); requestClose(); return; }
  if(e.key==="Tab"){
    const sheet = stack[stack.length-1].ov.querySelector(".sheet");
    const f = [...sheet.querySelectorAll(FOCUSABLE)].filter(el=>el.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && (document.activeElement===first || document.activeElement===sheet)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

  if(e.target.closest("[data-close]") || e.target.classList.contains("overlay")){ requestClose(); return; }
  if(e.target.closest("#gateBtn")){ pendingDoc = null; showOv("#mailOv"); return; }

});

/* 이메일 오타 힌트 (gmial.com → gmail.com 등) */
const DOMAINS = ["gmail.com","naver.com","daum.net","hanmail.net","kakao.com","nate.com","icloud.com","outlook.com","hotmail.com","yahoo.com"];
function dist(a,b){
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function suggest(email){
  const at = email.lastIndexOf("@"); if(at<1) return null;
  const dom = email.slice(at+1); if(!dom || DOMAINS.includes(dom)) return null;
  let best=null, bd=3;
  for(const c of DOMAINS){ const k=dist(dom,c); if(k<bd){ bd=k; best=c; } }
  return best && bd<=2 ? email.slice(0,at+1)+best : null;
}
function showHint(){
  const v = $("#email").value.trim().toLowerCase();
  const s = suggest(v), h = $("#hint");
  if(s){ h.innerHTML = `혹시 <b></b> 인가요? <button type="button">네, 고칠게요</button>`; h.querySelector("b").textContent = s; h.querySelector("button").dataset.fix = s; h.hidden = false; }
  else h.hidden = true;
}
$("#email").addEventListener("blur", showHint);
/* 전화번호는 입력하는 대로 010-1234-5678 형태로 맞춰줌 */
function formatPhone(d){ return d.length<4 ? d : d.length<8 ? d.slice(0,3)+"-"+d.slice(3) : d.slice(0,3)+"-"+d.slice(3,d.length-4)+"-"+d.slice(-4); }
$("#phone").addEventListener("input", e=>{ e.target.value = formatPhone(e.target.value.replace(/\D/g,"").slice(0,11)); e.target.removeAttribute("aria-invalid"); });
$("#name").addEventListener("input", e=>e.target.removeAttribute("aria-invalid"));
$("#email").addEventListener("input", ()=>{ $("#email").removeAttribute("aria-invalid"); if(!$("#hint").hidden) showHint(); });

async function saveLead(lead){
  if(!(SUPABASE_URL && SUPABASE_KEY)){ console.warn("[배포 점검] 테스트 모드: 저장되지 않았어요.", lead); return; }
  if(!navigator.onLine) throw {kind:"offline"};
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), FETCH_TIMEOUT_MS);
  let r;
  try{
    r = await fetch(`${SUPABASE_URL}/rest/v1/leads`,{
      method:"POST", signal:ctrl.signal,
      headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",
               Prefer:"return=minimal"},
      body:JSON.stringify(lead)
    });
  }catch(ex){
    throw {kind: ex && ex.name==="AbortError" ? "timeout" : (navigator.onLine ? "network" : "offline")};
  }finally{ clearTimeout(timer); }
  if(r.status===409) return;   // 이미 등록된 이메일 → 그대로 열어줌 (목록 읽기 권한은 일부러 안 줌)
  if(!r.ok) throw {kind:"server", status:r.status};
}
const ERRORS = {
  offline:"인터넷 연결이 끊긴 것 같아요. 연결을 확인하고 다시 눌러주세요.",
  timeout:"응답이 너무 늦어요. 잠시 후 다시 눌러주세요.",
  network:"서버에 연결하지 못했어요. 와이파이·데이터를 바꿔서 다시 시도해주세요.",
  server:s=>`저장이 거절됐어요(코드 ${s}). 잠시 후 다시 시도하고, 계속 안 되면 인스타 DM으로 알려주세요.`
};

$("#form").addEventListener("submit", async e=>{
  e.preventDefault();
  const input = $("#email"), err = $("#err");
  const email = input.value.trim().toLowerCase();
  const name = $("#name").value.trim();
  const phone = $("#phone").value.replace(/\D/g,"");
  err.textContent = "";
  if(name.length < 2){ $("#name").setAttribute("aria-invalid","true"); err.textContent="이름을 2글자 이상 입력해주세요."; return; }
  if(!/^01[016789]\d{7,8}$/.test(phone)){ $("#phone").setAttribute("aria-invalid","true"); err.textContent="휴대폰 번호를 확인해주세요. 예: 010-1234-5678"; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ input.setAttribute("aria-invalid","true"); err.textContent="이메일 주소 형식을 확인해주세요. 예: name@gmail.com"; return; }
  if(!$("#c1").checked){ err.textContent="개인정보 수집·이용에 동의해야 열 수 있어요."; return; }
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "여는 중…";
  const doc = pendingDoc;
  try{
    await saveLead({name, phone: formatPhone(phone), email, marketing_consent: $("#c2").checked, source: "profile-link" + (doc ? ":" + doc.id : "")});
    setUnlocked();
    pendingDoc = null;
    requestClose();
    // 도장이 다 찍히는 걸 보여준 뒤, 고른 자료가 있으면 그 페이지로 이동 (인앱 브라우저라 새 창 대신 같은 창)
    stampAll(()=>{ if(doc) location.href = doc.url; });
  }catch(ex){
    err.textContent = ex.kind==="server" ? ERRORS.server(ex.status) : (ERRORS[ex.kind] || ERRORS.network);
  }finally{ btn.disabled = false; btn.textContent = "전부 열기"; }
});
